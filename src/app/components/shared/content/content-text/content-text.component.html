<article class="content-text" aria-label="content item">
	<ng-container *ngIf="link; else noLink">
		<a [href]="link" class="content-link" [attr.aria-label]="title || 'content link'">
			<header class="content-header">
				<h3 *ngIf="title" [class.cta]="isCta">{{ title }}</h3>
				<p *ngIf="subtitle" class="subtitle">{{ subtitle }}</p>
			</header>
			<section class="content-body" role="region">
				<ng-content></ng-content>
			</section>
		</a>
	</ng-container>

	<ng-template #noLink>
		<header class="content-header">
			<h3 *ngIf="title">{{ title }}</h3>
			<p *ngIf="subtitle" class="subtitle">{{ subtitle }}</p>
		</header>
		<section class="content-body" role="region">
			<ng-content></ng-content>
		</section>
	</ng-template>

	<!-- Floating media (image or title) shown on hover; aria-hidden since decorative -->
	<div class="floating-media" [style.width]="image ? imgWidthStyle : null" aria-hidden="true">
		<ng-container *ngIf="image; else floatTitle">
			<figure>
				<img [src]="image" loading="lazy" decoding="async" alt="{{ title || 'floating image' }}" />
			</figure>
		</ng-container>
		<ng-template #floatTitle>
			<h1 class="floating-title">{{ title }}</h1>
		</ng-template>
	</div>
</article>
